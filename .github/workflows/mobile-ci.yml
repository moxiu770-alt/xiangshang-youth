name: Platform CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xiangshang_youth
          POSTGRES_USER: xiangshang
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xiangshang -d xiangshang_youth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Migrate and seed test database
        env:
          DATABASE_URL: postgres://xiangshang:ci_password@127.0.0.1:5432/xiangshang_youth?options=-csearch_path%3Dxiangshang_integration%2Cpublic
          TEST_DATABASE_URL: postgres://xiangshang:ci_password@127.0.0.1:5432/xiangshang_youth?options=-csearch_path%3Dxiangshang_integration%2Cpublic
          SEED_PASSWORD: TestPass123!
        run: |
          psql postgres://xiangshang:ci_password@127.0.0.1:5432/xiangshang_youth -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS xiangshang_integration AUTHORIZATION xiangshang'
          npm run migrate
          npm run seed
      - name: Run backend checks and unit tests
        run: npm run check && npm test
      - name: Run backend integration tests
        env:
          DATABASE_URL: postgres://xiangshang:ci_password@127.0.0.1:5432/xiangshang_youth?options=-csearch_path%3Dxiangshang_integration%2Cpublic
          TEST_DATABASE_URL: postgres://xiangshang:ci_password@127.0.0.1:5432/xiangshang_youth?options=-csearch_path%3Dxiangshang_integration%2Cpublic
          SEED_PASSWORD: TestPass123!
          TEST_VERBOSE_SERVER_LOGS: "true"
        run: npm run test:integration
      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate OpenAPI contract
        run: npm run lint:openapi
      - name: Create and verify database backup
        env:
          DATABASE_URL: postgres://xiangshang:ci_password@127.0.0.1:5432/xiangshang_youth
          PGPASSWORD: ci_password
        run: |
          BACKUP_DIR="$RUNNER_TEMP/xiangshang-backups" npm run backup
          backup_file="$(find "$RUNNER_TEMP/xiangshang-backups" -name '*.dump' -type f -print -quit)"
          test -n "$backup_file"
          BACKUP_FILE="$backup_file" npm run backup:verify
          psql --username=xiangshang --dbname=postgres://xiangshang:ci_password@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS xiangshang_restore_verify'
          createdb --host=127.0.0.1 --port=5432 --username=xiangshang --owner=xiangshang --maintenance-db=postgres xiangshang_restore_verify
          BACKUP_FILE="$backup_file" RESTORE_DATABASE_URL=postgres://xiangshang:ci_password@127.0.0.1:5432/xiangshang_restore_verify RESTORE_SCHEMA=xiangshang_integration RESTORE_EXPECT_DATA=true npm run backup:restore-verify
          psql --username=xiangshang --dbname=postgres://xiangshang:ci_password@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS xiangshang_restore_verify'

  production-container:
    name: Production container contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose interpolation
        working-directory: backend
        run: |
          set -a
          source .env.production.example
          set +a
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Build production API image
        run: docker build --pull --tag xiangshang-youth-api:ci backend
      - name: Verify runtime user and PostgreSQL backup tools
        run: |
          docker run --rm --entrypoint sh xiangshang-youth-api:ci -c 'test "$(id -u)" != 0 && node --version && pg_dump --version && pg_restore --version'
      - name: Validate gateway configuration
        run: >-
          docker run --rm --network none --entrypoint caddy
          -e PUBLIC_HOST=api.example.edu.cn
          -e ACME_EMAIL=ops@example.edu.cn
          -v "$GITHUB_WORKSPACE/backend/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine validate --config /etc/caddy/Caddyfile --adapter caddyfile

  source-integrity:
    name: Source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify patch whitespace
        run: git diff --check HEAD^
      - name: Verify cross-platform model contract
        run: python3 scripts/check_model_contract.py
      - name: Run model golden corpus gate
        run: node scripts/evaluate_model_corpus.mjs
      - name: Run deterministic model boundary fuzz gate
        run: node scripts/fuzz_model_boundaries.mjs
      - name: Run leak-safe calibration fitter test
        run: node scripts/test_model_calibration.mjs
      - name: Verify cross-platform frontend contract
        run: python3 scripts/check_frontend_contract.py
      - name: Enforce domain file boundaries
        run: python3 scripts/check_large_file_boundaries.py
      - name: Enforce migration sequence
        run: python3 scripts/check_migration_sequence.py
      - name: Run local release preflight (no secrets, no devices)
        run: python3 scripts/release_preflight.py --target local --allow-missing-devices --json "$RUNNER_TEMP/youth-local-preflight.json"
      - name: Discover device matrix without fabricating results
        run: python3 scripts/device_matrix_preflight.py --output "$RUNNER_TEMP/youth-device-matrix.json"
      - name: Upload release preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: xiangshang-youth-release-preflight
          path: |
            ${{ runner.temp }}/youth-local-preflight.json
            ${{ runner.temp }}/youth-device-matrix.json
          if-no-files-found: error

  android:
    name: Android unit test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run Android unit tests
        id: android-unit-tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1 --console=plain
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiangshang-youth-android-unit-test-reports
          path: |
            android/app/build/test-results/testDebugUnitTest
            android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
      - name: Report Android unit-test failures
        if: steps.android-unit-tests.outcome == 'failure'
        run: python3 ../scripts/report_junit_failures.py app/build/test-results/testDebugUnitTest "Android JVM tests" && exit 1
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --max-workers=1 --console=plain
      - name: Build debug and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=1 --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiangshang-youth-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Compose instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: xiangshang-youth-android-instrumentation
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Prepare hosted Android emulator
        run: |
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is not configured}}"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          yes | "$android_sdk/cmdline-tools/latest/bin/sdkmanager" "system-images;android-34;google_apis;x86_64" >/dev/null
          printf 'no\n' | "$android_sdk/cmdline-tools/latest/bin/avdmanager" create avd --force --name XiangshangYouth_CI_API34 --package "system-images;android-34;google_apis;x86_64" --device pixel_2
      - name: Run Compose instrumentation flow on a clean emulator
        id: android-instrumentation
        continue-on-error: true
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is not configured}}"
          adb_cmd="$android_sdk/platform-tools/adb"
          mkdir -p "$RUNNER_TEMP/android-visual-evidence" "$RUNNER_TEMP/android-emulator"
          "$android_sdk/emulator/emulator" -avd XiangshangYouth_CI_API34 -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot >"$RUNNER_TEMP/android-emulator/emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            "$adb_cmd" emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          timeout 180s "$adb_cmd" wait-for-device
          booted=0
          for _ in $(seq 1 120); do
            if [ "$("$adb_cmd" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ "$booted" != "1" ]; then
            tail -200 "$RUNNER_TEMP/android-emulator/emulator.log" || true
            exit 1
          fi
          "$adb_cmd" shell settings put global window_animation_scale 0
          "$adb_cmd" shell settings put global transition_animation_scale 0
          "$adb_cmd" shell settings put global animator_duration_scale 0
          ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain
          "$adb_cmd" shell run-as com.xiangshang.youth cat files/visual-evidence/launch-poster.png > "$RUNNER_TEMP/android-visual-evidence/launch-poster.png"
          test -s "$RUNNER_TEMP/android-visual-evidence/launch-poster.png"
      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiangshang-youth-android-instrumentation-reports
          path: |
            android/app/build/outputs/androidTest-results/connected
            android/app/build/reports/androidTests/connected
          if-no-files-found: warn
      - name: Report Android instrumentation failures
        if: steps.android-instrumentation.outcome == 'failure'
        run: python3 ../scripts/report_junit_failures.py app/build/outputs/androidTest-results/connected "Android Compose UI tests" && exit 1
      - name: Upload Android visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiangshang-youth-android-visual-evidence
          path: |
            ${{ runner.temp }}/android-visual-evidence
            ${{ runner.temp }}/android-emulator
          if-no-files-found: warn

  field-client:
    name: Windows field client
    runs-on: windows-latest
    defaults:
      run:
        working-directory: field-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore locked dependencies
        run: |
          dotnet restore FieldClient.Core.Tests/FieldClient.Core.Tests.csproj --locked-mode
          dotnet restore FieldClient.Windows/FieldClient.Windows.csproj --locked-mode
      - name: Test offline outbox
        run: dotnet test FieldClient.Core.Tests/FieldClient.Core.Tests.csproj --configuration Release --no-restore
      - name: Build Windows field client
        run: dotnet build FieldClient.Windows/FieldClient.Windows.csproj --configuration Release --no-restore
      - name: Verify Windows publish artifact
        run: dotnet publish FieldClient.Windows/FieldClient.Windows.csproj --configuration Release --runtime win-x64 --self-contained false --no-restore -p:PublishSingleFile=true --output ./artifacts/field-client-win-x64
      - name: Block vulnerable NuGet dependencies
        shell: pwsh
        run: |
          $result = dotnet list FieldClient.Windows/FieldClient.Windows.csproj package --vulnerable --include-transitive | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $result
          if ($exitCode -ne 0) { throw "NuGet vulnerability scan failed with exit code $exitCode." }
          if ($result -match 'has the following vulnerable packages') { throw 'Vulnerable field-client dependency detected.' }

  ios:
    name: iOS tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$device_id"
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run XCTest and UI tests
        run: >-
          xcodebuild
          -project ios/XiangshangYouth/XiangshangYouth.xcodeproj
          -scheme XiangshangYouth
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          -resultBundlePath "$RUNNER_TEMP/XiangshangYouth.xcresult"
          test -quiet
      - name: Upload iOS test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiangshang-youth-ios-xcresult
          path: ${{ runner.temp }}/XiangshangYouth.xcresult
          if-no-files-found: warn
