name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-integrity:
    name: Source integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify patch whitespace
        run: git diff --check HEAD^

  android:
    name: Android unit test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run unit tests and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2 --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiangshang-youth-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$device_id"
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run XCTest and UI tests
        run: >-
          xcodebuild
          -project ios/XiangshangYouth/XiangshangYouth.xcodeproj
          -scheme XiangshangYouth
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          test -quiet
