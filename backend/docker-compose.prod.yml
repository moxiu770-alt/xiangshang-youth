services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: sh -c 'node scripts/production-preflight.js && exec node src/server.js'
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
      VERIFICATION_CODE_PEPPER: ${VERIFICATION_CODE_PEPPER:?set VERIFICATION_CODE_PEPPER}
      REQUIRE_MFA_FOR_PRIVILEGED: ${REQUIRE_MFA_FOR_PRIVILEGED:-true}
      AUDIT_LOG_SIGNING_KEY: ${AUDIT_LOG_SIGNING_KEY:?set AUDIT_LOG_SIGNING_KEY}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:?set SMS_WEBHOOK_URL}
      SMS_WEBHOOK_AUTHORIZATION: ${SMS_WEBHOOK_AUTHORIZATION:?set SMS_WEBHOOK_AUTHORIZATION}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:?set NOTIFICATION_WEBHOOK_URL}
      NOTIFICATION_WEBHOOK_AUTHORIZATION: ${NOTIFICATION_WEBHOOK_AUTHORIZATION:?set NOTIFICATION_WEBHOOK_AUTHORIZATION}
      NOTIFICATION_WEBHOOK_TIMEOUT_MS: ${NOTIFICATION_WEBHOOK_TIMEOUT_MS:-10000}
      PUSH_TOKEN_ENCRYPTION_KEY: ${PUSH_TOKEN_ENCRYPTION_KEY:?set PUSH_TOKEN_ENCRYPTION_KEY}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?set WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?set WECHAT_APP_SECRET}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:?set WECHAT_REDIRECT_URI}
      OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS:-300}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      TRUST_PROXY: "true"
      REQUIRE_HEALTH_CONSENT: ${REQUIRE_HEALTH_CONSENT:-true}
      HEALTH_DATA_RETENTION_DAYS: ${HEALTH_DATA_RETENTION_DAYS:-2555}
      FIELD_EVIDENCE_VIDEO_RETENTION_DAYS: ${FIELD_EVIDENCE_VIDEO_RETENTION_DAYS:-180}
      FIELD_EVIDENCE_DERIVED_RETENTION_DAYS: ${FIELD_EVIDENCE_DERIVED_RETENTION_DAYS:-1095}
      FIELD_EVIDENCE_ORPHAN_RETENTION_HOURS: ${FIELD_EVIDENCE_ORPHAN_RETENTION_HOURS:-24}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-s3}
      S3_STORAGE_ENDPOINT: ${S3_STORAGE_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
      BACKUP_ENABLED: "true"
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_HEARTBEAT_INTERVAL_SECONDS: ${BACKUP_HEARTBEAT_INTERVAL_SECONDS:-15}
      BACKUP_HEARTBEAT_MAX_AGE_SECONDS: ${BACKUP_HEARTBEAT_MAX_AGE_SECONDS:-60}
      BACKUP_ARCHIVE_ENABLED: ${BACKUP_ARCHIVE_ENABLED:-true}
      BACKUP_ARCHIVE_PREFIX: ${BACKUP_ARCHIVE_PREFIX:-xiangshang/database}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      JOB_WORKER_ENABLED: "false"
      JOB_WORKER_MODE: external
      JOB_WORKER_INTERVAL_MS: ${JOB_WORKER_INTERVAL_MS:-1000}
      JOB_WORKER_CONCURRENCY: ${JOB_WORKER_CONCURRENCY:-4}
      JOB_WORKER_SHUTDOWN_TIMEOUT_MS: ${JOB_WORKER_SHUTDOWN_TIMEOUT_MS:-25000}
      FIELD_DEVICE_KEY_TTL_DAYS: ${FIELD_DEVICE_KEY_TTL_DAYS:-90}
      FIELD_DEVICE_SIGNING_ENCRYPTION_KEY: ${FIELD_DEVICE_SIGNING_ENCRYPTION_KEY:?set FIELD_DEVICE_SIGNING_ENCRYPTION_KEY}
      FIELD_DEVICE_SIGNED_REQUESTS_REQUIRED: "true"
      FIELD_DEVICE_SIGNATURE_MAX_AGE_SECONDS: ${FIELD_DEVICE_SIGNATURE_MAX_AGE_SECONDS:-300}
      FIELD_DEVICE_OFFLINE_AFTER_SECONDS: ${FIELD_DEVICE_OFFLINE_AFTER_SECONDS:-90}
      FIELD_LIVENESS_RECONCILE_INTERVAL_SECONDS: ${FIELD_LIVENESS_RECONCILE_INTERVAL_SECONDS:-30}
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-60}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  worker:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: sh -c 'node scripts/worker-preflight.js && exec node src/worker.js'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      AUDIT_LOG_SIGNING_KEY: ${AUDIT_LOG_SIGNING_KEY:?set AUDIT_LOG_SIGNING_KEY}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:?set NOTIFICATION_WEBHOOK_URL}
      NOTIFICATION_WEBHOOK_AUTHORIZATION: ${NOTIFICATION_WEBHOOK_AUTHORIZATION:?set NOTIFICATION_WEBHOOK_AUTHORIZATION}
      NOTIFICATION_WEBHOOK_TIMEOUT_MS: ${NOTIFICATION_WEBHOOK_TIMEOUT_MS:-10000}
      PUSH_TOKEN_ENCRYPTION_KEY: ${PUSH_TOKEN_ENCRYPTION_KEY:?set PUSH_TOKEN_ENCRYPTION_KEY}
      JOB_WORKER_ENABLED: "true"
      JOB_WORKER_MODE: worker
      JOB_WORKER_INTERVAL_MS: ${JOB_WORKER_INTERVAL_MS:-1000}
      JOB_WORKER_CONCURRENCY: ${JOB_WORKER_CONCURRENCY:-4}
      JOB_WORKER_SHUTDOWN_TIMEOUT_MS: ${JOB_WORKER_SHUTDOWN_TIMEOUT_MS:-25000}
      FIELD_DEVICE_OFFLINE_AFTER_SECONDS: ${FIELD_DEVICE_OFFLINE_AFTER_SECONDS:-90}
      FIELD_LIVENESS_RECONCILE_INTERVAL_SECONDS: ${FIELD_LIVENESS_RECONCILE_INTERVAL_SECONDS:-30}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-60}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  backup:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: sh -c 'node scripts/backup-preflight.js && exec node scripts/backup-runner.js'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      BACKUP_ENABLED: "true"
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_HEARTBEAT_INTERVAL_SECONDS: ${BACKUP_HEARTBEAT_INTERVAL_SECONDS:-15}
      BACKUP_HEARTBEAT_MAX_AGE_SECONDS: ${BACKUP_HEARTBEAT_MAX_AGE_SECONDS:-60}
      BACKUP_ARCHIVE_ENABLED: ${BACKUP_ARCHIVE_ENABLED:-true}
      BACKUP_ARCHIVE_PREFIX: ${BACKUP_ARCHIVE_PREFIX:-xiangshang/database}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?set BACKUP_S3_ENDPOINT}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?set BACKUP_S3_BUCKET}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:?set BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:?set BACKUP_S3_SECRET_KEY}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
    volumes:
      - backup_data:/backups
    healthcheck:
      test: ["CMD", "node", "scripts/backup-healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  prometheus:
    image: prom/prometheus:v3.5.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


  migrate:
    build: .
    profiles: ["migrate"]
    command: node scripts/migrate.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      TRUST_PROXY: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  backup_data:
  caddy_data:
  caddy_config:
  prometheus_data:

secrets:
  metrics_token:
    file: ${METRICS_TOKEN_FILE:-./monitoring/metrics_token}
