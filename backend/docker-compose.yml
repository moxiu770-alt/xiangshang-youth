services:
  postgres:
    image: postgres:16-alpine
    container_name: xiangshang-youth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xiangshang_youth
      POSTGRES_USER: xiangshang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xiangshang_dev}
    ports:
      - "5432:5432"
    volumes:
      - xiangshang_postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiangshang -d xiangshang_youth"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: node src/server.js
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      DATABASE_URL: postgres://xiangshang:${POSTGRES_PASSWORD:-xiangshang_dev}@postgres:5432/xiangshang_youth
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  xiangshang_postgres:
