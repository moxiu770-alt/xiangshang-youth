      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: queueEntryId, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/admin/test-queues/rebalance:
    post:
      operationId: postAdminTestQueuesRebalance
      summary: 将未开始的学生均衡分配到测试点；无就绪设备时允许预分流，但正式采集仍受开测门禁限制
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [taskId], properties: { taskId: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/admin/test-queues/{queueEntryId}/transition:
    post:
      operationId: postAdminTestQueueTransition
      summary: 由后台授权人员调度单个候测队列条目；叫号必须就绪，签到必须先叫号并明确确认学生身份
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: queueEntryId, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status, expectedVersion], properties: { status: { type: string, enum: [waiting, called, checked_in, retest, absent, skipped, paused, cancelled] }, stationId: { type: [string, 'null'] }, expectedVersion: { type: integer, minimum: 1 }, identityVerified: { type: boolean, description: status 为 checked_in 时必须为 true，表示已当面核对姓名、班级和学籍信息 }, reason: { type: string, minLength: 1, maxLength: 500, description: status 为 absent、skipped、cancelled 或 retest 时必填，作为审计处置原因 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Conflict' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/admin/test-queues/{queueEntryId}/assign:
    post:
      operationId: postAdminTestQueueAssign
      summary: 将单个候测或待重测学生安全调整到另一个已就绪且有容量的测试点
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: queueEntryId, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [stationId, expectedVersion, reason], properties: { stationId: { type: string }, expectedVersion: { type: integer, minimum: 1 }, reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Conflict' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/admin/test-sessions:
    get:
      operationId: getAdminTestSessions
      summary: 分页查询场地会话，支持任务、测试点、状态、待处理分组和服务端搜索，并返回各分组总量
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: query, name: schoolId, required: true, schema: { type: string } }, { in: query, name: taskId, schema: { type: string } }, { in: query, name: stationId, schema: { type: string } }, { in: query, name: status, schema: { type: string } }, { in: query, name: view, description: 服务端会话分组筛选, schema: { type: string, enum: [attention, active, completed, all], default: all } }, { in: query, name: search, description: 按学生姓名、学籍号、任务、测试点或设备编码搜索, schema: { type: string, maxLength: 120 } }, { in: query, name: paged, description: 传 1 时返回 items、total、page、pageSize 与 counts, schema: { type: string, enum: ['1'] } }, { in: query, name: page, schema: { type: integer, minimum: 1 } }, { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/admin/assessment-protocols:
    get:
      operationId: getAdminAssessmentProtocols
      summary: 获取学校可用的版本化测试方案及固定项目顺序
      description: 同时返回平台通用方案和学校专属方案；任务与会话保存方案快照，后续修改不会改写历史。
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: query, name: schoolId, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /v1/admin/test-sessions/{sessionId}:
    get:
      operationId: getAdminTestSession
      summary: 查看可复核的采集会话、动作事件、证据和成绩
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/admin/test-sessions/{sessionId}/review:
    post:
      operationId: postAdminTestSessionReview
      summary: 在证据上下文内确认场地成绩或原子安排补测，并同步会话、候测队列与任务学生状态
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, retest] }
                reason: { type: string, maxLength: 1000, description: 安排补测或修改成绩时必填 }
                scores:
                  type: array
                  maxItems: 7
                  items:
                    type: object
                    required: [scoreId, score]
                    properties:
                      scoreId: { type: string }
                      score: { type: number, minimum: 0, maximum: 5 }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Conflict' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/admin/test-sessions/{sessionId}/recover:
    post:
      operationId: postAdminTestSessionRecover
      summary: 在设备离线或已明确停止后，将卡住的现场会话原子收口为已中止并安排补测；在线设备仍在接管时拒绝操作
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Conflict' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/admin/field/stream:
    get:
      operationId: getAdminFieldStream
      summary: 订阅设备、队列、会话和指令的 SSE 实时状态流
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: query, name: schoolId, required: true, schema: { type: string } }]
      responses:
        '200': { description: text/event-stream 响应；事件类型包括 ready、device.heartbeat、device.offline、queue.updated、session.opened、session.completed、command.issued }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/device-commands:
    post:
      operationId: postAdminDeviceCommand
      summary: 向场地设备下发受审计的远程命令；暂停、停止和恢复会同步更新中央持久控制状态
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [deviceId, commandType], properties: { deviceId: { type: string }, commandType: { type: string, enum: [pause, resume, stop, call_next, recall, skip, retest, refresh_config] }, payload: { type: object, additionalProperties: true }, expiresAt: { type: string, format: date-time } } } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/Conflict' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/field/bootstrap:
    get:
      operationId: getFieldBootstrap
      summary: 下发版本化测试方案、固定项目顺序、可选任务目录、本站学生名单、分流摘要、标定与待执行指令
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      parameters: [{ in: query, name: taskId, required: false, description: 场地端选择的已发布任务；省略时按日期自动选择, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthError' } }
  /v1/field/heartbeat:
    post:
      operationId: postFieldHeartbeat
      summary: 上报设备状态、能力与正式采集自检；未通过自检的边缘主机不得开启正式测试会话
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [health]
              properties:
                softwareVersion: { type: string, maxLength: 120 }
                capabilities: { type: object, additionalProperties: true }
                health:
                  type: object
                  required: [schemaVersion, selfTest, capture, storage, calibration]
                  properties:
                    schemaVersion: { type: string, enum: [field-health/v1] }
                    emergencyStop: { type: boolean, default: false }
                    selfTest:
                      type: object
                      required: [passed, completedAt]
                      properties:
                        passed: { type: boolean }
                        completedAt: { type: string, format: date-time }
                        message: { type: string }
                    capture:
                      type: object
                      required: [adapterReady, adapterName, depthCameraCount, rgbCameraCount, gpuReady, frameSyncOffsetMs]
                      properties:
                        adapterReady: { type: boolean }
                        adapterName: { type: string }
                        depthCameraCount: { type: integer, minimum: 0 }
                        rgbCameraCount: { type: integer, minimum: 0 }
                        gpuReady: { type: boolean }
                        frameSyncOffsetMs: { type: [number, 'null'], minimum: 0 }
                    storage:
                      type: object
                      required: [freeMb]
                      properties:
                        freeMb: { type: integer, minimum: 0 }
                    calibration:
                      type: object
                      required: [passed, version, checksumSha256, errorCm]
                      properties:
                        passed: { type: boolean }
                        version: { type: [string, 'null'] }
                        checksumSha256: { type: [string, 'null'], pattern: '^[A-Fa-f0-9]{64}$' }
                        errorCm: { type: [number, 'null'], minimum: 0 }
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthError' } }
  /v1/field/commands:
    get:
      operationId: getFieldCommands
      summary: 领取当前设备待执行的远程指令
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthError' } }
  /v1/field/commands/{commandId}/ack:
    post:
      operationId: postFieldCommandAck
      summary: 确认或失败回执设备指令；同一设备只能处理自身指令一次
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      parameters: [{ in: path, name: commandId, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { failed: { type: boolean, default: false } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthError' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/field/files/presign:
    post:
      operationId: postFieldFilePresign
      summary: 为当前设备创建短时、一次性的场地证据上传记录
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fileName, contentType, fileSize], properties: { fileName: { type: string, maxLength: 255 }, contentType: { type: string }, fileSize: { type: integer, minimum: 0, maximum: 20000000 } } } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/AuthError' } }
  /v1/field/files/{fileId}/content:
    put:
      operationId: putFieldFileContent
      summary: 上传已创建的场地证据原始字节；服务端校验大小、文件签名、设备所有权和一次性状态
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      parameters: [{ in: path, name: fileId, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          text/plain: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          video/mp4: { schema: { type: string, format: binary } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/AuthError' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '410': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/Conflict' } }
  /v1/field/queue/transition:
    post:
      operationId: postFieldQueueTransition
      summary: 由当前设备按版本号推进叫号与签到；签到必须先叫号并明确确认身份，测试中和已完成只能由正式会话接口生成
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [queueEntryId, status, expectedVersion], properties: { queueEntryId: { type: string }, status: { type: string, enum: [waiting, called, checked_in, retest, absent, skipped, paused, cancelled] }, expectedVersion: { type: integer, minimum: 1 }, identityVerified: { type: boolean, description: status 为 checked_in 时必须为 true，表示现场操作员已完成身份核验 }, reason: { type: string, maxLength: 500 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/AuthError' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/field/sessions:
    post:
      operationId: postFieldSession
      summary: 在正式开测门禁通过后创建或幂等返回场地会话
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientSessionId, taskId, studentId], properties: { clientSessionId: { type: string, maxLength: 120, description: 设备端稳定生成的会话键；可带业务前缀，不强制 UUID 格式 }, taskId: { type: string }, studentId: { type: string }, startedAt: { type: string, format: date-time }, algorithmVersion: { type: string, maxLength: 120 }, summary: { type: object, additionalProperties: true } } } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/AuthError' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/field/sessions/{sessionId}/events:
    post:
      operationId: postFieldSessionEvents
      summary: 追加可重放的场地动作事件，客户端事件 ID 和序号不可被不同内容复用
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, minItems: 1, maxItems: 200, items: { type: object, required: [clientEventId, sequenceNo, eventType], properties: { clientEventId: { type: string, format: uuid }, sequenceNo: { type: integer, minimum: 0 }, eventType: { type: string, maxLength: 64 }, happenedAt: { type: string, format: date-time }, payload: { type: object, additionalProperties: true } } } } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/AuthError' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/field/sessions/{sessionId}/complete:
    post:
      operationId: postFieldSessionComplete
      summary: 提交场地最终成绩、证据关联和自动复核状态；成绩项目必须与任务项目完全一致
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [scores], properties: { algorithmVersion: { type: string, maxLength: 120 }, endedAt: { type: string, format: date-time }, outcome: { type: string, enum: [completed, retest] }, scores: { type: array, minItems: 1, maxItems: 7, items: { type: object, required: [item, score, confidence], properties: { item: { type: string }, score: { type: number, minimum: 0, maximum: 5 }, confidence: { type: number, minimum: 0, maximum: 1 }, reviewStatus: { type: string, enum: [passed, pendingReview], description: 缺失或非 passed 时服务端将保守地进入待复核 }, note: { type: string, maxLength: 1000 }, evidence: { type: object, additionalProperties: true } } } }, evidence: { type: array, maxItems: 30, items: { type: object, required: [fileId, evidenceType], properties: { fileId: { type: string }, evidenceType: { type: string, enum: [video, image, skeleton, timeline, calibration, log, other] }, checksumSha256: { type: string, pattern: '^[A-Fa-f0-9]{64}$' }, metadata: { type: object, additionalProperties: true } } } }, summary: { type: object, additionalProperties: true } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/AuthError' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/field/sessions/{sessionId}/abort:
    post:
      operationId: postFieldSessionAbort
      summary: 将无法恢复的中断采集会话关闭，并原子安排学生补测
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { endedAt: { type: string, format: date-time }, reason: { type: string, maxLength: 500 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthError' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/field/sync/batches:
    post:
      operationId: postFieldSyncBatches
      summary: 幂等补传场地端队列、会话、动作、完成和中断恢复事件
      description: 对已关闭或归档任务的迟到离线叫号、签到和开测事实，仅追加审计时间线并将会话归档为 aborted；不得重新开启任务、队列或学生状态。直接在线接口仍拒绝修改非已发布任务。
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientBatchId, events]
              properties:
                clientBatchId: { type: string, format: uuid }
                events:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [clientEventId, eventType, payload]
                    properties:
                      clientEventId: { type: string, format: uuid }
                      eventType: { type: string }
                      happenedAt: { type: string, format: date-time }
                      payload: { type: object }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/FieldSyncFailure' }, '409': { $ref: '#/components/responses/FieldSyncFailure' } }
  /v1/field/sync/conflict-resolutions:
    get:
      operationId: getFieldSyncConflictResolutions
      summary: 获取后台已确认的同步冲突，供当前设备解除本地冲突标记并保留历史事实
      tags: [Field]
      security: [{ fieldDeviceId: [], fieldDeviceTimestamp: [], fieldDeviceNonce: [], fieldDeviceBodyHash: [], fieldDeviceSignature: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthError' } }
  /v1/mobile/events:
    post:
      operationId: postMobileProductEvents
      summary: 提交用户主动开启的隐私最小化产品事件
      description: 仅接受固定事件、粗粒度周期、平台、版本和单次启动随机会话；不接受用户、儿童、学校、设备或健康数据。
      tags: [Product]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductEventBatchRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/AuthError' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    fieldDeviceId:
      type: apiKey
      in: header
      name: X-Device-Id
    fieldDeviceTimestamp:
      type: apiKey
      in: header
      name: X-Device-Timestamp
    fieldDeviceNonce:
      type: apiKey
      in: header
      name: X-Device-Nonce
    fieldDeviceBodyHash:
      type: apiKey
      in: header
      name: X-Device-Body-Hash
    fieldDeviceSignature:
      type: apiKey
      in: header
      name: X-Device-Signature
  parameters:
    SchoolId:
      in: path
      name: schoolId
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 128 }
  schemas:
    FieldSyncFailureReceipt:
      type: object
      required: [clientBatchId, acceptedEventIds, failedEventId, unprocessedEventIds]
      properties:
        clientBatchId: { type: string, format: uuid }
        acceptedEventIds: { type: array, items: { type: string, format: uuid } }
        failedEventId: { type: [string, 'null'], format: uuid }
        unprocessedEventIds: { type: array, items: { type: string, format: uuid } }
        failedEvent:
          type: object
          description: 不保存原始媒体或完整成绩，只提供后台定位冲突所需的最小业务上下文
          properties:
            clientEventId: { type: string }
            eventType: { type: string }
            queueEntryId: { type: string }
            status: { type: string }
            expectedVersion: { type: [integer, 'null'] }
            clientSessionId: { type: string }
            taskId: { type: string }
            studentId: { type: string }
            sessionId: { type: string }
    ContentReleaseItem:
      type: object
      required: [contentType, contentId]
      properties:
        contentType: { type: string, enum: [course, activity, expert, notification_template, scoring_rule] }
        contentId: { type: string }
        contentVersion: { type: integer, minimum: 1, default: 1 }
        sortOrder: { type: integer, default: 0 }
        metadata: { type: object, additionalProperties: true }
    ProductEventBatchRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ProductEventInput' }
    ProductEventInput:
      type: object
      additionalProperties: false
      required: [eventId, eventName, platform, appVersion, clientSessionId, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        eventName: { type: string, enum: [growth_report_opened, growth_report_period_changed, adaptive_plan_opened_courses] }
        coarseValue: { type: [string, 'null'], enum: [本周, 本月, null] }
        platform: { type: string, enum: [ios, android] }
        appVersion: { type: string, minLength: 1, maxLength: 40, pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,39}$' }
        clientSessionId: { type: string, format: uuid, description: 每次 App 启动随机生成；服务端仅保存其 SHA-256 摘要 }
        occurredAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [account]
      properties:
        account: { type: string }
        password: { type: string, format: password }
        verificationCode: { type: string, pattern: '^\\d{6}$', description: 使用短信登录时提供；与 password 二选一 }
    VerificationCodeRequest:
      type: object
      required: [account, purpose]
      properties:
        account: { type: string, pattern: '^1\\d{10}$' }
        purpose: { type: string, enum: [login, register, reset-password] }
    ParentRegistrationRequest:
      type: object
      required: [name, phone, verificationCode, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, pattern: '^1\\d{10}$' }
        verificationCode: { type: string, pattern: '^\\d{6}$' }
        password: { type: string, format: password, minLength: 8 }
        roleCode: { type: string, enum: [parent], default: parent }
    MobileAuthRole:
      type: object
      required: [roleCode, campusIds, authorizedGradeIds, authorizedClassIds, capabilities, mobileEntryAllowed]
      properties:
        roleCode: { type: string, enum: [parent, teacher, principal, admin] }
        name: { type: string }
        schoolId: { type: [string, 'null'] }
        campusIds: { type: array, items: { type: string } }
        authorizedGradeIds: { type: array, items: { type: string } }
        authorizedClassIds: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        mobileEntryAllowed: { type: boolean }
    MobileAuthClaims:
      type: object
      required: [claimsVersion, activeRole, accountRoles, user]
      properties:
        claimsVersion: { type: integer, minimum: 1 }
        activeRole: { type: string, enum: [parent, teacher, principal, admin] }
        accountRoles: { type: array, items: { $ref: '#/components/schemas/MobileAuthRole' } }
        user:
          type: object
          required: [id, name, phone, roleCode, schoolName, authorizedClassIds, capabilities, mobileEntryAllowed]
          properties:
            id: { type: string }
            name: { type: string }
            phone: { type: string }
            role: { type: string }
            roleCode: { type: string }
            schoolId: { type: [string, 'null'] }
            schoolName: { type: string }
            avatarInitials: { type: string }
            authorizedGradeIds: { type: array, items: { type: string } }
            authorizedClassIds: { type: array, items: { type: string } }
            capabilities: { type: array, items: { type: string } }
            mobileEntryAllowed: { type: boolean }
    DeviceInstallationRequest:
      type: object
      required: [platform, provider, environment, deviceInstanceId, pushToken]
      properties:
        platform: { type: string, enum: [ios, android] }
        provider: { type: string, enum: [apns, fcm] }
        environment: { type: string, enum: [sandbox, production] }
        deviceInstanceId: { type: string, minLength: 12, maxLength: 256, description: App 安装实例随机标识；服务端仅保存哈希 }
        pushToken: { type: string, minLength: 20, maxLength: 4096, writeOnly: true }
        appVersion: { type: string, maxLength: 64 }
        locale: { type: string, maxLength: 32 }
    DeviceInstallation:
      type: object
      required: [installationId, platform, provider, environment, status, tokenLastFour, lastRegisteredAt, createdAt]
      properties:
        installationId: { type: string }
        platform: { type: string, enum: [ios, android] }
        provider: { type: string, enum: [apns, fcm] }
        environment: { type: string, enum: [sandbox, production] }
        status: { type: string, enum: [active, invalid, revoked] }
        appVersion: { type: [string, 'null'] }
        locale: { type: [string, 'null'] }
        tokenLastFour: { type: string, minLength: 4, maxLength: 4, description: 仅用于用户识别设备；不是可投递令牌 }
        lastRegisteredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AssessmentStandardCreateRequest:
      type: object
      required: [standardVersion, effectiveDate]
      properties:
        schoolId: { type: [string, 'null'], description: 仅平台管理员可省略，表示中央继承标准 }
        gradeId: { type: [string, 'null'] }
        region: { type: string, maxLength: 80 }
        povertyArea: { type: [boolean, 'null'] }
        standardVersion: { type: string, maxLength: 120 }
        effectiveDate: { type: string, format: date }
        status: { type: string, enum: [draft, active], default: draft }
        ruleConfig: { type: object, additionalProperties: true }
        reportConfig: { type: object, additionalProperties: true }
        courseConfig: { type: object, additionalProperties: true }
    AccountCreateRequest:
      type: object
      required: [name, phone, password, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, pattern: '^1\\d{10}$' }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [admin, principal, teacher, parent] }
        schoolId: { type: string }
        classId: { type: string }
    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data: {}
    CourseSuggestion:
      type: object
      required: [id, courseId, lessonId, title, duration, focus, isPublicBenefit]
      properties:
        id: { type: string }
        courseId: { type: string }
        lessonId: { type: string }
        title: { type: string }
        duration: { type: string }
        focus: { type: string }
        isPublicBenefit: { type: boolean }
    BodyScreeningDecision:
      type: object
      required: [route, outcomeLevel, reasonCodes, reviewRequired, decisionPolicyVersion]
      properties:
        sessionId: { type: string }
        decisionId: { type: string }
        route: { type: string, enum: [auto_archive, recapture_required, professional_review] }
        outcomeLevel: { type: string, enum: [capture_invalid, no_obvious_abnormality, training_observation, school_retest, professional_evaluation] }
        reasonCodes: { type: array, items: { type: string } }
        modelConfidence: { type: number, minimum: 0, maximum: 1 }
        modelUncertainty: { type: number, minimum: 0, maximum: 1 }
        qualityScore: { type: integer, minimum: 0, maximum: 100 }
        reviewRequired: { type: boolean }
        decisionPolicyVersion: { type: string }
        version: { type: integer, minimum: 1 }
        decidedAt: { type: string, format: date-time }
        reviewStatus: { type: string, enum: [pending, in_review, completed, recapture_requested] }
        reviewDecision: { type: string, enum: [archive, continue_observation, refer_for_professional_assessment, recapture] }
        reviewComment: { type: string, maxLength: 2000 }
        requestedRecaptureTasks:
          type: array
          uniqueItems: true
          items: { type: string, enum: [standingFront, standingBack, standingSide, forwardBend, dynamicKneeControl, gaitVideo, seatedPosture, footArch] }
        reviewVersion: { type: integer, minimum: 1 }
        reviewedAt: { type: string, format: date-time }
    PostureDomainValidation:
      type: object
      required: [spinal_alignment, shoulder_pelvis, head_upper_posture, trunk_rotation, dynamic_knee, gait, seated_posture, foot_arch]
      properties:
        spinal_alignment: { type: string, enum: [pending-human-validation, human-validated] }
        shoulder_pelvis: { type: string, enum: [pending-human-validation, human-validated] }
        head_upper_posture: { type: string, enum: [pending-human-validation, human-validated] }
        trunk_rotation: { type: string, enum: [pending-human-validation, human-validated] }
        dynamic_knee: { type: string, enum: [pending-human-validation, human-validated] }
        gait: { type: string, enum: [pending-human-validation, human-validated] }
        seated_posture: { type: string, enum: [pending-human-validation, human-validated] }
        foot_arch: { type: string, enum: [pending-human-validation, human-validated] }
      additionalProperties: false
    BodyPostureReport:
      type: object
      required: [validationStatus, domainValidation, classificationPublished]
      properties:
        validationStatus: { type: string, enum: [pending-human-validation, human-validated] }
        domainValidation: { $ref: '#/components/schemas/PostureDomainValidation' }
        classificationPublished:
          type: boolean
          description: 仅当总姿态模型与八个问题域全部完成独立人工验证时为 true。
      additionalProperties: true
    BodyScreeningReviewAttempt:
      type: object
      required: [captureTask, attemptCount, sampleCount, confidence, qualityEvents]
      properties:
        captureTask: { type: string, enum: [standingFront, standingBack, standingSide, forwardBend, dynamicKneeControl, gaitVideo, seatedPosture, footArch] }
        attemptCount: { type: integer, minimum: 1 }
        sampleCount: { type: integer, minimum: 0 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        qualityScore: { type: integer, minimum: 0, maximum: 100 }
        qualityEvents: { type: array, items: { type: string } }
        repeatabilityDifference: { type: number, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        evidenceMetrics:
          type: array
          description: 服务端白名单投影；绝不包含原始媒体、任意客户端 JSON 或未经授权的仪器声明。
          items: { $ref: '#/components/schemas/BodyScreeningEvidenceMetric' }
    BodyScreeningEvidenceMetric:
      type: object
      required: [code, label, source]
      properties:
        code: { type: string }
        label: { type: string }
        numericValue: { type: number }
        textValue: { type: string }
        unit: { type: string, description: 摄像头来源必须明确标注为投影值或摄像头估计，不能标成物理测量。 }
        source: { type: string, enum: [camera_proxy, guardian_observation, instrument] }
    BodyScreeningReviewItem:
      type: object
      required: [reviewId, sessionId, status, version, studentId, studentDisplayName, route, reasonCodes, attempts]
      properties:
        reviewId: { type: string }
        sessionId: { type: string }
        status: { type: string, enum: [pending, in_review, recapture_requested] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        studentId: { type: string }
        classId: { type: string }
        studentDisplayName: { type: string, description: 服务端脱敏展示名 }
        route: { type: string, enum: [professional_review] }
        reasonCodes: { type: array, items: { type: string } }
        qualityScore: { type: integer, minimum: 0, maximum: 100 }
        modelConfidence: { type: number, minimum: 0, maximum: 1 }
        modelUncertainty: { type: number, minimum: 0, maximum: 1 }
        decidedAt: { type: string, format: date-time }
        protocolVersion: { type: string }
        modelVersion: { type: string }
        thresholdVersion: { type: string }
        measuredAt: { type: string, format: date-time }
        attempts: { type: array, items: { $ref: '#/components/schemas/BodyScreeningReviewAttempt' } }
    BodyScreeningReviewAck:
      type: object
      required: [reviewId, sessionId, status, requestedRecaptureTasks, version]
      properties:
        reviewId: { type: string }
        sessionId: { type: string }
        status: { type: string, enum: [completed, recapture_requested] }
        decision: { type: string, enum: [archive, continue_observation, refer_for_professional_assessment, recapture] }
        comment: { type: string, maxLength: 2000 }
        requestedRecaptureTasks:
          type: array
          items: { type: string, enum: [standingFront, standingBack, standingSide, forwardBend, dynamicKneeControl, gaitVideo, seatedPosture, footArch] }
        version: { type: integer, minimum: 1 }
        reviewedAt: { type: string, format: date-time }
    BodyAssessmentLatestEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: object
          additionalProperties: true
          properties:
            postureReport: { $ref: '#/components/schemas/BodyPostureReport' }
            screeningDecision: { $ref: '#/components/schemas/BodyScreeningDecision' }
    BodyScreeningReviewListEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data: { type: array, items: { $ref: '#/components/schemas/BodyScreeningReviewItem' } }
    BodyScreeningReviewAckEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/BodyScreeningReviewAck' }
    DiagnosisReportPayload:
      type: object
      required: [id, student, assessmentDate, scores, totalScore, ruleVersion, courseSuggestions]
      properties:
        id: { type: string }
        student: { type: object, additionalProperties: true }
        assessmentDate: { type: string, format: date }
        scores: { type: array, items: { type: object, additionalProperties: true } }
        totalScore: { type: number }
        riskLevel: { type: string }
        ruleVersion: { type: string }
        courseSuggestions:
          type: array
          items: { $ref: '#/components/schemas/CourseSuggestion' }
    DiagnosisReportEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: string }
        message: { type: string }
        data: { $ref: '#/components/schemas/DiagnosisReportPayload' }
  responses:
    FieldSyncFailure:
      description: 同步批次部分失败；已确认事件、失败事件和未处理事件按原顺序返回，客户端可安全拆批续传
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: { type: string }
              message: { type: string }
              data: { $ref: '#/components/schemas/FieldSyncFailureReceipt' }
    Success:
      description: Successful response
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    ReportSuccess:
      description: Published or freshly regenerated school assessment report
      content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosisReportEnvelope' } } }
    Created:
      description: Created response
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    Accepted:
      description: Accepted for asynchronous processing
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    Forbidden:
      description: Permission denied
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    AuthError:
      description: Authentication failure
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer } }
    Conflict:
      description: Conflict or idempotency collision
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
    ServerError:
      description: Server error
