  /v1/students/{studentId}/body-assessments:
    post:
      summary: "POST /v1/students/{studentId}/body-assessments"
      description: "仅已绑定学生的监护人可提交。不得上传原始照片、视频或原始骨架帧；姿态采集只提交结构化指标与质量追溯。带 UY-CAPTURE-GUIDED 协议的记录必须来自后置 1×镜头并通过质量门。Marker-PnP 还必须匹配服务端已批准的手机/镜头/分辨率内参配置，不能由客户端自行声明。"
      operationId: postV1StudentsStudentIdBodyAssessments
      tags: [School]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: studentId, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [heightCm, weightKg, consentVersion, snapshots]
              properties:
                heightCm: { type: number, minimum: 90, maximum: 190 }
                weightKg: { type: number, minimum: 15, maximum: 90 }
                consentVersion: { type: string, minLength: 1, maxLength: 120 }
                algorithmVersion: { type: string, maxLength: 120 }
                snapshots:
                  type: array
                  minItems: 8
                  maxItems: 8
                  items:
                    type: object
                    required: [captureTask, sampleCount, confidence, metrics]
                    properties:
                      captureTask: { type: string, enum: [standingFront, standingBack, standingSide, forwardBend, dynamicKneeControl, gaitVideo, seatedPosture, footArch] }
                      sampleCount: { type: integer, minimum: 0, maximum: 10000 }
                      confidence: { type: number, minimum: 0, maximum: 1 }
                      metrics:
                        type: object
                        description: "仅限聚合姿态指标与 captureMetadata；严禁原始媒体、图片路径、视频地址或原始关键点帧。"
                        properties:
                          captureProtocolVersion: { type: string, pattern: '^UY-CAPTURE-(GUIDED|MARKER-PNP)-' }
                          cameraFacing: { type: string, enum: [rear-1x, front-preview] }
                          measurementMode: { type: string, enum: [rgb-pose-2d, depth-assisted-3d] }
                          deviceCapabilityTier: { type: string, enum: [standard-2d, enhanced-depth] }
                          depthAvailable: { type: boolean }
                          segmentPhaseCount: { type: integer, minimum: 1, maximum: 4 }
                          qualityChecks: { type: array, items: { type: string }, uniqueItems: true, description: "UY-CAPTURE-GUIDED-3.x 必须包含 two-take-repeatability；动态膝控制还必须包含 three-repetition-cycle；足弓步骤必须包含 foot-close-up 与 lower-limb-landmarks，不能用 full-body 代替。" }
                          captureCalibration:
                            type: object
                            description: "当前移动端直接序列化的标定追溯字段；Marker-PnP 必须匹配服务端已批准 profileId。"
                            properties:
                              mode: { type: string, enum: [guided, marker-pnp] }
                              boardDetected: { type: boolean }
                              boardId: { type: string, maxLength: 120 }
                              intrinsicsId: { type: string, maxLength: 120 }
                              lensId: { type: string, maxLength: 120 }
                              resolution: { type: string, pattern: '^[0-9]{3,5}x[0-9]{3,5}$' }
                              reprojectionErrorPx: { type: number, minimum: 0, maximum: 10 }
                              profileId: { type: string, maxLength: 120, description: "服务端批准的设备、镜头和分辨率标定配置编号" }
                          captureMetadata:
                            type: object
                            properties:
                              captureProtocolVersion: { type: string, pattern: '^UY-CAPTURE-(GUIDED|MARKER-PNP)-' }
                              cameraFacing: { type: string, enum: [rear-1x, front-preview] }
                              measurementMode: { type: string, enum: [rgb-pose-2d, depth-assisted-3d] }
                              deviceCapabilityTier: { type: string, enum: [standard-2d, enhanced-depth] }
                              depthAvailable: { type: boolean }
                              segmentPhaseCount: { type: integer, minimum: 1, maximum: 4 }
                              qualityChecks: { type: array, items: { type: string }, uniqueItems: true, description: "UY-CAPTURE-GUIDED-3.x 必须包含 two-take-repeatability；动态膝控制还必须包含 three-repetition-cycle；足弓步骤必须包含 foot-close-up 与 lower-limb-landmarks，不能用 full-body 代替。" }
                              calibration:
                                type: object
                                properties:
                                  mode: { type: string, enum: [guided, marker-pnp] }
                                  boardDetected: { type: boolean }
                                  boardId: { type: string, maxLength: 120 }
                                  intrinsicsId: { type: string, maxLength: 120 }
                                  lensId: { type: string, maxLength: 120 }
                                  resolution: { type: string, pattern: '^[0-9]{3,5}x[0-9]{3,5}$' }
                                  reprojectionErrorPx: { type: number, minimum: 0, maximum: 10 }
                                  profileId: { type: string, maxLength: 120 }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/Conflict' } }
