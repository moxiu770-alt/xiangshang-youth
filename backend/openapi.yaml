openapi: 3.1.0
info:
  title: 向上少年 API
  version: 1.0.0
  description: 学校运动健康管理平台核心接口。创建、审批和密码恢复等关键写操作支持 Idempotency-Key；状态更新可携带 expectedVersion。
  license:
    name: Proprietary
    identifier: Proprietary
servers:
  - url: /
    description: 当前部署的 API 主机
tags:
  - name: System
    description: 服务健康检查与运行指标
  - name: Auth
    description: 登录、会话和账户安全
  - name: School
    description: 学校、学生和测评业务
  - name: Admin
    description: 平台管理和数据治理
  - name: Field
    description: Windows 场地端设备、离线同步和采集会话
  - name: Product
    description: 用户主动开启的匿名产品体验改进事件
paths:
  /livez:
    get:
      summary: "GET /livez"
      operationId: getLivez
      tags: [System]
      security: []
      responses:
        '400': { $ref: '#/components/responses/Conflict' }
        '200': { description: Service process is alive }
  /readyz:
    get:
      summary: "GET /readyz"
      operationId: getReadyz
      tags: [System]
      security: []
      responses:
        '400': { $ref: '#/components/responses/Conflict' }
        '200': { description: Database is ready }
        '500': { $ref: '#/components/responses/ServerError' }
  /metrics:
    get:
      summary: "GET /metrics"
      operationId: getMetrics
      tags: [System]
      security: []
      responses:
        '400': { $ref: '#/components/responses/Conflict' }
        '200': { description: Prometheus text exposition }
        '401': { $ref: '#/components/responses/AuthError' }
  /v1/public/field-client-release:
    get:
      summary: 查询 Windows 场地端发布包
      description: 返回当前自包含 Windows x64 客户端的版本、大小、SHA-256 和下载地址；安装包不包含学校或设备密钥。
      operationId: getPublicFieldClientRelease
      tags: [Field]
      security: []
      responses:
        '200':
          description: 发布包状态；available=false 表示服务器尚未生成发布包
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [available, platform, runtime, sizeBytes, unsigned, executable]
                        properties:
                          available: { type: boolean }
                          version: { type: [string, 'null'] }
                          platform: { type: string }
                          runtime: { type: string }
                          sizeBytes: { type: integer, minimum: 0 }
                          sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
                          generatedAt: { type: [string, 'null'], format: date-time }
                          unsigned: { type: boolean }
                          downloadUrl: { type: [string, 'null'] }
                          executable: { type: string }
        '400': { $ref: '#/components/responses/Conflict' }
  /downloads/xiangshang-field-client-windows-x64.zip:
    get:
      summary: 下载 Windows 场地端自包含压缩包
      operationId: downloadFieldClientWindowsX64
      tags: [Field]
      security: []
      responses:
        '200':
          description: Windows x64 ZIP 安装包
          headers:
            X-Checksum-Sha256: { schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/auth/login:
    post:
      summary: "POST /v1/auth/login"
      operationId: postV1AuthLogin
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '400': { $ref: '#/components/responses/Conflict' }
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/oauth/wechat/start:
    post:
      summary: "POST /v1/auth/oauth/wechat/start"
      description: 创建一次性、短时微信授权 state，并返回已配置的开放平台授权地址。
      operationId: postV1AuthOAuthWechatStart
      tags: [Auth]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServerError' }
  /v1/auth/oauth/wechat/callback:
    get:
      summary: "GET /v1/auth/oauth/wechat/callback"
      description: 微信开放平台 HTTPS 回调中转到原生 App 的自定义 scheme；不在 URL 中放置会话或用户资料。
      operationId: getV1AuthOAuthWechatCallback
      tags: [Auth]
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Redirect to the native app callback scheme }
        '200': { description: Callback acknowledged when the native scheme cannot be opened by the user agent }
        '400': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServerError' }
  /v1/auth/oauth/wechat/exchange:
    post:
      summary: "POST /v1/auth/oauth/wechat/exchange"
      description: 使用一次性 code/state 换取平台会话；首次授权创建家长账户，手机号在绑定流程中补齐。
      operationId: postV1AuthOAuthWechatExchange
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string, minLength: 1 }
                state: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthError' }
        '503': { $ref: '#/components/responses/ServerError' }
  /v1/auth/verification-codes:
    post:
      summary: "POST /v1/auth/verification-codes"
      description: 向已配置的短信网关请求一次性验证码；明文验证码不在平台数据库或接口响应中留存。
      operationId: postV1AuthVerificationCodes
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationCodeRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServerError' }
  /v1/auth/mfa/totp:
    post:
      summary: "POST /v1/auth/mfa/totp"
      description: 完成密码登录后返回的短时 TOTP/恢复码挑战；成功后才创建访问和刷新会话。
      operationId: postV1AuthMfaTotp
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string, description: 6 位动态口令或一次性恢复码 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/AuthError' }
        '503': { $ref: '#/components/responses/ServerError' }
  /v1/auth/mfa/enroll/setup:
    post:
      summary: "POST /v1/auth/mfa/enroll/setup"
      description: 管理员或校长首次登录时的受控 TOTP 注册步骤，必须使用密码登录返回的 enrollment challenge。
      operationId: postV1AuthMfaEnrollSetup
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [challengeToken], properties: { challengeToken: { type: string } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/AuthError' }, '503': { $ref: '#/components/responses/ServerError' } }
  /v1/auth/mfa/enroll/confirm:
    post:
      summary: "POST /v1/auth/mfa/enroll/confirm"
      operationId: postV1AuthMfaEnrollConfirm
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [challengeToken, code], properties: { challengeToken: { type: string }, code: { type: string } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Conflict' }, '401': { $ref: '#/components/responses/AuthError' } }
  /v1/auth/refresh:
    post:
      summary: "POST /v1/auth/refresh"
      operationId: postV1AuthRefresh
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '400': { $ref: '#/components/responses/Conflict' }
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthError' }
  /v1/auth/password:
    post:
      summary: "POST /v1/auth/password"
      operationId: postV1AuthPassword
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Conflict' }
  /v1/auth/reset-password:
    post:
      summary: "POST /v1/auth/reset-password"
      operationId: postV1AuthResetPassword
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [token, newPassword]
                - required: [phone, verificationCode, newPassword]
              properties:
                token: { type: string }
                phone: { type: string, pattern: '^1\\d{10}$' }
                verificationCode: { type: string, pattern: '^\\d{6}$' }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Conflict' }
  /v1/me/sessions:
    get:
      summary: "GET /v1/me/sessions"
      operationId: getV1MeSessions
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '400': { $ref: '#/components/responses/Conflict' }
        '200': { $ref: '#/components/responses/Success' }
  /v1/me/sessions/{sessionId}:
    delete:
      summary: "DELETE /v1/me/sessions/{sessionId}"
      operationId: deleteV1MeSessionsSessionId
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      responses:
        '400': { $ref: '#/components/responses/Conflict' }
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Conflict' }
  /v1/me/deletion-request:
    get:
      summary: "GET /v1/me/deletion-request"
      description: 查询当前账户最近一次注销申请及处理状态。
      operationId: getV1MeDeletionRequest
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/AuthError' }

    post:
      summary: "POST /v1/me/deletion-request"
      description: 申请注销账户。申请需要平台管理员审核，批准后异步匿名化账户、撤销会话并清理直接身份信息。
      operationId: postV1MeDeletionRequest
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/schools/{schoolId}/dashboard:
    get:
      summary: "GET /v1/schools/{schoolId}/dashboard"
      operationId: getV1SchoolsSchoolIdDashboard
      tags: [School]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/SchoolId' }
        - { in: query, name: studentPage, schema: { type: integer, minimum: 1 }, description: "按页返回学生目录；学校级统计仍为全量聚合" }
        - { in: query, name: studentPageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 100 }, description: "学生目录每页条数" }
      responses:
        '400': { $ref: '#/components/responses/Conflict' }
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/schools/{schoolId}/students:
    get:
      summary: "GET /v1/schools/{schoolId}/students"
      operationId: getV1SchoolsSchoolIdStudents
      tags: [School]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/SchoolId' }
        - { in: query, name: classId, schema: { type: string } }
        - { in: query, name: paged, schema: { type: integer, enum: [0, 1] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '400': { $ref: '#/components/responses/Conflict' }
        '200': { $ref: '#/components/responses/Success' }
  /v1/admin/accounts:
    get:
      summary: "GET /v1/admin/accounts"
      operationId: getV1AdminAccounts
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: schoolId, schema: { type: string } }
        - { in: query, name: role, schema: { type: string, enum: [admin, principal, teacher, parent] } }
        - { in: query, name: status, schema: { type: string, enum: [active, disabled] } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
      responses:
        '400': { $ref: '#/components/responses/Conflict' }
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: "POST /v1/admin/accounts"
      operationId: postV1AdminAccounts
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AccountCreateRequest' } }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/audit-logs:
    get:
      summary: "GET /v1/admin/audit-logs"
      operationId: getV1AdminAuditLogs
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: schoolId, schema: { type: string } }
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: paged, schema: { type: integer, enum: [0, 1] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/account-deletion-requests:
    get:
      summary: "GET /v1/admin/account-deletion-requests"
      description: 平台管理员查看账户注销申请队列。
      operationId: getV1AdminAccountDeletionRequests
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, processing, completed, rejected, failed] } }
        - { in: query, name: paged, schema: { type: integer, enum: [0, 1] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/account-deletion-requests/{requestId}:
    patch:
      summary: "PATCH /v1/admin/account-deletion-requests/{requestId}"
      description: 批准或拒绝账户注销申请；批准后由后台任务异步完成匿名化。
      operationId: patchV1AdminAccountDeletionRequestsRequestId
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: requestId, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Conflict' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/admin/audit-integrity:
    get:
      summary: "GET /v1/admin/audit-integrity"
      description: 校验当前签名密钥下新产生审计事件的学校级或平台级哈希链；旧记录是历史基线，不计入链条。
      operationId: getV1AdminAuditIntegrity
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: schoolId, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServerError' }
  /v1/admin/jobs:
    get:
      summary: "GET /v1/admin/jobs"
      operationId: getV1AdminJobs
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [queued, processing, completed, failed], default: failed } }
        - { in: query, name: paged, schema: { type: integer, enum: [0, 1] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /v1/admin/jobs/{jobId}/retry:
    post:
      summary: "POST /v1/admin/jobs/{jobId}/retry"
      description: 仅平台管理员可重试失败任务；操作会记录失败上下文与重试人。
      operationId: postV1AdminJobsJobIdRetry
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: jobId, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/Conflict' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/admin/accounts/{accountId}:
    patch:
      summary: "PATCH /v1/admin/accounts/{accountId}"
      operationId: patchV1AdminAccountsAccountId
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: accountId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string }
                role: { type: string, enum: [admin, principal, teacher, parent] }
                schoolId: { type: string }
                classId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/accounts/{accountId}/reset-password:
    post:
      summary: "POST /v1/admin/accounts/{accountId}/reset-password"
      operationId: postV1AdminAccountsAccountIdResetPassword
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: accountId, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Conflict' }
  /v1/admin/accounts/{accountId}/reset-mfa:
    post:
      summary: "POST /v1/admin/accounts/{accountId}/reset-mfa"
      description: 仅平台管理员可在身份验证器遗失时恢复账户 MFA；操作会撤销目标账户全部会话并记入审计链。
      operationId: postV1AdminAccountsAccountIdResetMfa
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: accountId, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 8, maxLength: 500 } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/students/{studentId}/binding-code:
    post:
      summary: "POST /v1/admin/students/{studentId}/binding-code"
      operationId: postV1AdminStudentsStudentIdBindingCode
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: studentId, required: true, schema: { type: string } }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Conflict' }
  /v1/files/{fileId}/content:
    get:
      summary: "GET /v1/files/{fileId}/content"
      operationId: getV1FilesFileIdContent
      tags: [School]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: fileId, required: true, schema: { type: string } }
      responses:
        '200': { description: Authenticated file content }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: "PUT /v1/files/{fileId}/content"
      operationId: putV1FilesFileIdContent
      tags: [School]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: fileId, required: true, schema: { type: string } }
